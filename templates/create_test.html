{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="glass-card p-5 animate-fade-in">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('student_profile', student_id=student.id) }}" class="btn btn-outline-secondary me-3">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="text-gradient mb-0">Создать тест для {{ student.full_name }}</h1>
        </div>

        <form method="POST">
            <div class="mb-4">
                <label class="form-label fw-semibold text-dark mb-2">Название теста</label>
                <input type="text" name="title" class="form-control form-control-lg"
                       placeholder="Введите название теста" required>
                <div class="form-text">Например: "Проверка знаний по теме 'Present Simple'"</div>
            </div>

            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-gradient px-4">
                    <i class="fas fa-plus me-2"></i>Создать тест
                </button>
                <a href="{{ url_for('student_profile', student_id=student.id) }}"
                   class="btn btn-outline-secondary px-4">Отмена</a>
            </div>
        </form>
    </div>
</div>

<style>
.form-control-lg {
    font-size: 1.1rem;
    padding: 1rem 1.25rem;
    border-radius: 15px;
}

.form-label {
    font-size: 1.1rem;
    color: var(--dark);
}

.form-text {
    font-size: 0.9rem;
    color: var(--gray);
    margin-top: 0.5rem;
}
</style>
{% endblock %}
