<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать тест для ученика</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #A5810A;
            --primary-dark: #7A833D;
            --secondary: #4C4F3F;
            --light: #FAF7EA;
            --lighter: #EBE8D2;
            --dark: #4C4F3F;
            --darker: #3E3A09;
            --success: #7A833D;
            --danger: #8B4513;
            --warning: #C7AE2B;
            --gray: #7C7C53;
            --gray-light: #E7E7D9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            background-image: url('https://i.pinimg.com/1200x/94/86/c9/9486c96860a224d02a528a949416adf9.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            color: var(--dark);
            line-height: 1.5;
            min-height: 100vh;
            position: relative;
            font-size: 0.9rem;
        }

        body::before {
            content: '';
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(60, 62, 38, 0.58);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            position: relative;
        }

        /* Навигация */
        .navbar {
            background: rgba(235, 232, 210, 0.95);
            padding: 1rem 0;
            box-shadow: 0 4px 12px rgba(72, 77, 55, 0.6);
            border-radius: 0 0 20px 20px;
            margin-bottom: 2rem;
        }

        .navbar-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .navbar-brand {
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            color: var(--darker);
            text-decoration: none;
        }

        .navbar-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .navbar-text {
            color: var(--darker);
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Кнопки */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
            font-size: 0.85rem;
            gap: 0.3rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--warning));
            color: var(--darker);
            box-shadow: 0 4px 12px rgba(199, 174, 43, 0.7);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--warning), var(--primary));
            box-shadow: 0 6px 16px rgba(199, 174, 43, 0.9);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--secondary);
            color: var(--secondary);
        }

        .btn-outline:hover {
            background: var(--secondary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #A0522D;
        }

        /* Карточки */
        .card {
            background: rgba(250, 247, 234, 0.9);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 6px 18px rgba(72, 77, 55, 0.12);
            border: 1px solid rgba(224, 231, 255, 0.3);
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--primary-dark));
        }

        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--lighter);
            padding: 0 0 1rem 0;
            margin-bottom: 1rem;
        }

        .card-title {
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: var(--darker);
            margin: 0;
        }

        /* Форма */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--darker);
            margin-bottom: 0.5rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--lighter);
            border-radius: 8px;
            font-size: 0.9rem;
            background: white;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            outline: none;
        }

        .radio-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .radio-option input {
            margin: 0;
        }

        /* Вопросы */
        .question-card {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--lighter);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .question-number {
            font-weight: 600;
            color: var(--primary);
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .remove-btn:hover {
            color: #A0522D;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .navbar-container {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .navbar-nav {
                flex-direction: column;
                gap: 0.8rem;
            }

            .radio-group {
                flex-direction: column;
            }

            .question-header {
                flex-direction: column;
                gap: 0.5rem;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar">
        <div class="navbar-container">
            <a class="navbar-brand" href="{{ url_for('home') }}">EduProgress</a>
            <div class="navbar-nav">
                <span class="navbar-text">Учитель: {{ session.username }}</span>
                <a class="btn btn-outline" href="{{ url_for('teacher_students') }}">
                    <i class="fas fa-arrow-left"></i>Назад к списку
                </a>
                <a class="btn btn-primary" href="{{ url_for('logout') }}">
                    <i class="fas fa-sign-out-alt"></i>Выйти
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Создать тест для ученика</h2>
            </div>
            <form id="testForm" method="POST" action="{{ url_for('create_test_for_student', student_id=student_id) }}">
                <!-- Название теста -->
                {{ csrf_token() }}
                <div class="form-group">
                    <label class="form-label" for="testTitle">Название теста:</label>
                    <input type="text" class="form-control" id="testTitle" name="test_title" required>
                </div>

                <!-- Контейнер для вопросов -->
                <div id="questionsContainer">
                    <!-- Первый вопрос по умолчанию -->
                    <div class="question-card" data-question-id="1">
                        <div class="question-header">
                            <span class="question-number">Вопрос 1</span>
                            <button type="button" class="remove-btn" onclick="removeQuestion(this)">×</button>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Текст вопроса:</label>
                            <input type="text" class="form-control" name="questions[1][text]" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Варианты ответов:</label>
                            <input type="text" class="form-control" name="questions[1][option_a]" placeholder="Вариант A" required>
                            <input type="text" class="form-control" name="questions[1][option_b]" placeholder="Вариант B" required>
                            <input type="text" class="form-control" name="questions[1][option_c]" placeholder="Вариант C" required>
                            <input type="text" class="form-control" name="questions[1][option_d]" placeholder="Вариант D" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Правильный ответ:</label>
                            <div class="radio-group">
                                <label class="radio-option">
                                    <input type="radio" name="questions[1][correct]" value="A" required> A
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="questions[1][correct]" value="B" required> B
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="questions[1][correct]" value="C" required> C
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="questions[1][correct]" value="D" required> D
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Кнопки -->
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-outline" onclick="addQuestion()">
                        <i class="fas fa-plus"></i>Добавить вопрос
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>Создать тест
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let questionCount = 1;

        function addQuestion() {
            questionCount++;
            const container = document.getElementById('questionsContainer');
            const questionCard = document.createElement('div');
            questionCard.className = 'question-card';
            questionCard.setAttribute('data-question-id', questionCount);
            questionCard.innerHTML = `
                <div class="question-header">
                    <span class="question-number">Вопрос ${questionCount}</span>
                    <button type="button" class="remove-btn" onclick="removeQuestion(this)">×</button>
                </div>
                <div class="form-group">
                    <label class="form-label">Текст вопроса:</label>
                    <input type="text" class="form-control" name="questions[${questionCount}][text]" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Варианты ответов:</label>
                    <input type="text" class="form-control" name="questions[${questionCount}][option_a]" placeholder="Вариант A" required>
                    <input type="text" class="form-control" name="questions[${questionCount}][option_b]" placeholder="Вариант B" required>
                    <input type="text" class="form-control" name="questions[${questionCount}][option_c]" placeholder="Вариант C" required>
                    <input type="text" class="form-control" name="questions[${questionCount}][option_d]" placeholder="Вариант D" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Правильный ответ:</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="questions[${questionCount}][correct]" value="A" required> A
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="questions[${questionCount}][correct]" value="B" required> B
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="questions[${questionCount}][correct]" value="C" required> C
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="questions[${questionCount}][correct]" value="D" required> D
                        </label>
                    </div>
                </div>
            `;
            container.appendChild(questionCard);
        }

        function removeQuestion(button) {
            if (questionCount > 1) {
                button.closest('.question-card').remove();
                questionCount--;
                updateQuestionNumbers();
            } else {
                alert('Нельзя удалить последний вопрос!');
            }
        }

        function updateQuestionNumbers() {
            const questions = document.querySelectorAll('.question-card');
            questions.forEach((card, index) => {
                card.querySelector('.question-number').textContent = `Вопрос ${index + 1}`;
            });
        }

        // Валидация формы перед отправкой
        document.getElementById('testForm').addEventListener('submit', function(e) {
            const title = document.getElementById('testTitle').value.trim();
            if (!title) {
                alert('Введите название теста!');
                e.preventDefault();
                return;
            }
            if (questionCount < 1) {
                alert('Добавьте хотя бы один вопрос!');
                e.preventDefault();
                return;
            }
        });
    </script>
</body>
</html>
