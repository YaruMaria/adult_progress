<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание теста</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .question-block {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background: #f8f9fa;
        }
        .question-header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        .horizontal-form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
            min-width: 250px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2>Создание теста для ученика</h2>

        <form method="POST" action="{{ url_for('create_test_for_student', student_id=student.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="horizontal-form">
                <div class="form-group">
                    <label class="form-label">Название теста *</label>
                    <input type="text" class="form-control" name="title" required placeholder="Введите название теста">
                </div>

                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <input type="text" class="form-control" name="description" placeholder="Описание теста">
                </div>
            </div>

            <div id="questions-container">
                <div class="question-block" id="question-1">
                    <div class="question-header d-flex justify-content-between align-items-center">
                        <span class="question-number">Вопрос 1</span>
                        <button type="button" class="btn btn-sm btn-danger" onclick="removeQuestion(1)" disabled>
                            <i class="fas fa-trash"></i> Удалить
                        </button>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Текст вопроса *</label>
                        <input type="text" class="form-control" name="question_1" required placeholder="Введите вопрос">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Правильный ответ *</label>
                        <input type="text" class="form-control" name="answer_1" required placeholder="Введите правильный ответ">
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-secondary w-100 mb-3" id="add-question">
                <i class="fas fa-plus me-1"></i>Добавить вопрос
            </button>

            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-plus me-2"></i>Создать тест
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let questionCount = 1;
            const maxQuestions = 10;

            const questionsContainer = document.getElementById('questions-container');
            const addQuestionBtn = document.getElementById('add-question');

            addQuestionBtn.addEventListener('click', function() {
                if (questionCount < maxQuestions) {
                    questionCount++;
                    const newQuestion = document.createElement('div');
                    newQuestion.className = 'question-block';
                    newQuestion.id = `question-${questionCount}`;
                    newQuestion.innerHTML = `
                        <div class="question-header d-flex justify-content-between align-items-center">
                            <span class="question-number">Вопрос ${questionCount}</span>
                            <button type="button" class="btn btn-sm btn-danger" onclick="removeQuestion(${questionCount})">
                                <i class="fas fa-trash"></i> Удалить
                            </button>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Текст вопроса *</label>
                            <input type="text" class="form-control" name="question_${questionCount}" required placeholder="Введите вопрос">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Правильный ответ *</label>
                            <input type="text" class="form-control" name="answer_${questionCount}" required placeholder="Введите правильный ответ">
                        </div>
                    `;
                    questionsContainer.appendChild(newQuestion);

                    if (questionCount > 1) {
                        const firstRemoveBtn = document.querySelector('#question-1 button.btn-danger');
                        if (firstRemoveBtn) firstRemoveBtn.disabled = false;
                    }

                    if (questionCount === maxQuestions) {
                        addQuestionBtn.disabled = true;
                        addQuestionBtn.innerHTML = '<i class="fas fa-ban me-1"></i>Максимум вопросов';
                    }
                }
            });
        });

        function removeQuestion(number) {
            const questionElem = document.getElementById(`question-${number}`);
            if (!questionElem) return;

            questionElem.remove();

            let questions = document.querySelectorAll('.question-block');
            let questionCount = questions.length;

            questions.forEach((q, index) => {
                const newNumber = index + 1;
                q.id = `question-${newNumber}`;
                const numberSpan = q.querySelector('.question-number');
                if (numberSpan) numberSpan.textContent = `Вопрос ${newNumber}`;

                const questionInput = q.querySelector('input[name^="question_"]');
                const answerInput = q.querySelector('input[name^="answer_"]');
                if (questionInput) questionInput.name = `question_${newNumber}`;
                if (answerInput) answerInput.name = `answer_${newNumber}`;

                const removeBtn = q.querySelector('button.btn-danger');
                if (removeBtn) {
                    removeBtn.setAttribute('onclick', `removeQuestion(${newNumber})`);
                    removeBtn.disabled = questionCount === 1;
                }
            });

            const addQuestionBtn = document.getElementById('add-question');
            if (addQuestionBtn) {
                addQuestionBtn.disabled = false;
                addQuestionBtn.innerHTML = '<i class="fas fa-plus me-1"></i>Добавить вопрос';
            }
        }

        // Разблокировать кнопку удаления первого вопроса, если добавлен второй
        if (questionCount > 1) {
            const firstRemoveBtn = document.querySelector('#question-1 .remove-question');

        }

        // Обновить кнопку добавления
        if (questionCount === maxQuestions) {
            addQuestionBtn.disabled = true;

        }
    }

    // Функция удаления вопроса с перенумерацией
    window.removeQuestion = function(number) {  // Делаем глобальной для onclick
        const questionElem = document.getElementById(`question-${number}`);
        if (!questionElem) return;

        questionElem.remove();
        questionCount--;

        // Перенумеровать оставшиеся вопросы и обновить имена полей
        const questions = document.querySelectorAll('.question-block');
        questions.forEach((question, index) => {
            const newNumber = index + 1;
            question.id = `question-${newNumber}`;
            const numberSpan = question.querySelector('.question-number');
            if (numberSpan) numberSpan.textContent = `Вопрос ${newNumber}`;

            const questionInput = question.querySelector('input[name^="question_"]');
            const answerInput = question.querySelector('input[name^="answer_"]');
            if (questionInput) questionInput.name = `question_${newNumber}`;
            if (answerInput) answerInput.name = `answer_${newNumber}`;

            // Обновить onclick для кнопки удаления
            const removeBtn = question.querySelector('.remove-question');
            if (removeBtn) {
                removeBtn.setAttribute('onclick', `removeQuestion(${newNumber})`);
                removeBtn.disabled = (questionCount === 1);  // Отключить, если остался один вопрос
            }
        });

        // Разблокировать кнопку добавления
        addQuestionBtn.disabled = false;
        addQuestionBtn.innerHTML = '<i class="fas fa-plus me-1"></i>Добавить вопрос';
    };

    // Обработчик для кнопки "Добавить вопрос"
    addQuestionBtn.addEventListener('click', function() {
        addQuestionField();
    });

    // Опционально: Проверка перед отправкой формы (на клиенте)
    const form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', function(e) {
            const questions = document.querySelectorAll('.question-block');
            if (questions.length === 0) {
                alert('Добавьте хотя бы один вопрос!');
                e.preventDefault();
                return;
            }
            // Дополнительные проверки (например, заполненность) можно добавить здесь

    }
