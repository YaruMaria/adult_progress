{% extends "base.html" %}

{% block title %}Вход - Progress{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="glass-card p-4 animate-fade-in">
                <h2 class="text-center mb-4 text-gradient">Вход для учителя</h2>

                <form method="POST">
                    <div class="mb-3">
                        <input type="text" name="username" class="form-control" placeholder="Логин" required>
                    </div>
                    <div class="mb-4">
                        <input type="password" name="password" class="form-control" placeholder="Пароль" required>
                    </div>
                    <button type="submit" class="btn btn-gradient w-100">Войти</button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted">Нет аккаунта?
                        <a href="{{ url_for('register') }}" class="text-decoration-none">Зарегистрироваться</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
